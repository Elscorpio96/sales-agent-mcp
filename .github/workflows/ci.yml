name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy sales_agent
      - run: pytest -q
      - name: CLI smoke test over stdio
        shell: bash
        run: |
          sales-agent seed --db data/shop.db
          sales-agent tools --db data/shop.db
          sales-agent call low_stock --db data/shop.db

  agent-evals:
    name: Agent evals (live model, runs when ANTHROPIC_API_KEY is configured)
    runs-on: ubuntu-latest
    needs: test
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip notice
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice title=Agent evals skipped::Add an ANTHROPIC_API_KEY repository secret to run the golden-question evals."
      - name: Install
        if: env.ANTHROPIC_API_KEY != ''
        run: python -m pip install -e . "evalsentry @ git+https://github.com/Elscorpio96/evalsentry@main"
      - name: Run golden questions
        if: env.ANTHROPIC_API_KEY != ''
        working-directory: evals
        run: evalsentry run -c evalsentry.yaml --github --html eval-report.html -o eval-results.json
      - uses: actions/upload-artifact@v4
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: agent-eval-report
          path: evals/eval-*
